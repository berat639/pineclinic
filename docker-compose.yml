services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: voiceai
      POSTGRES_USER: ${POSTGRES_USER:-voiceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceai_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceai} -d voiceai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voiceai}:${POSTGRES_PASSWORD:-voiceai_secret}@postgres:5432/voiceai
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      ASTERISK_AMI_HOST: asterisk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001/ws}
        SERVER_URL: http://server:3001
        BACKEND_PROXY_URL: http://server:3001
    restart: unless-stopped
    ports:
      - "3000:3002"
    environment:
      NODE_ENV: production
      SERVER_URL: http://server:3001
      BACKEND_PROXY_URL: http://server:3001
      DENTAL_SEGMENTATOR_URL: ${DENTAL_SEGMENTATOR_URL:-http://dental-segmentator:8000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - server

  # Restored full DentalSegmentator adapter. This remains opt-in because the
  # official nnU-Net image is large and its model must be mounted separately.
  dental-segmentator:
    profiles: ["dental-ai"]
    build:
      context: .
      dockerfile: services/dental-segmentator/Dockerfile
    restart: unless-stopped
    environment:
      DENTAL_SEGMENTATOR_MODE: ${DENTAL_SEGMENTATOR_MODE:-fast}
      DENTAL_SEGMENTATOR_DATASET: ${DENTAL_SEGMENTATOR_DATASET:-Dataset112_DentalSegmentator_v100}
      DENTAL_SEGMENTATOR_DEVICE: ${DENTAL_SEGMENTATOR_DEVICE:-cpu}
      NNUNET_RESULTS: /models/nnUNet_results
    # Docker Desktop currently exposes 8 CPUs / ~8 GB RAM. Keep all CPU
    # workers available and give PyTorch multiprocessing enough shared memory.
    cpus: "8"
    mem_limit: 7g
    shm_size: "4gb"
    ports:
      - "8000:8000"
    volumes:
      - dental_segmentator_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Asterisk SIP gateway (Netgsm SIP Trunk → AudioSocket → server:12000)
  # TELEPHONY_ENABLED=1 olduğunda kullanılır; lokalde NAT/RTP sorunlu olabilir,
  # bu nedenle telephony testleri sunucuda yapılır.
  asterisk:
    profiles: ["telephony"]
    build:
      context: ./infra/asterisk
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUDIOSOCKET_HOST: server
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-12000}
      BACKEND_HTTP_PORT: "3001"
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  dental_segmentator_models:
