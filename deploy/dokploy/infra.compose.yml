services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: voiceai
      POSTGRES_USER: ${POSTGRES_USER:-voiceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceai_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceai} -d voiceai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      dokploy-network:
        aliases: [voiceai-postgres]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      dokploy-network:
        aliases: [voiceai-redis]

  asterisk:
    build:
      context: ../../infra/asterisk
    restart: always
    environment:
      AUDIOSOCKET_HOST: voiceai-server
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-12000}
      BACKEND_HTTP_PORT: "3001"
      TELEPHONY_CLINIC_HOSTNAME: ${TELEPHONY_CLINIC_HOSTNAME:-pineclinic.thinpine.com}
      TELEPHONY_DID_MAP: ${TELEPHONY_DID_MAP:-}
      NETGSM_SIP_HOST: ${NETGSM_SIP_HOST:-sip.netgsm.com.tr}
      NETGSM_SIP_PORT: ${NETGSM_SIP_PORT:-5060}
      NETGSM_SIP_TRANSPORT: ${NETGSM_SIP_TRANSPORT:-tcp}
      NETGSM_SIP_USER: ${NETGSM_SIP_USER}
      NETGSM_SIP_PASSWORD: ${NETGSM_SIP_PASSWORD}
      NETGSM_PUBLIC_IP: ${NETGSM_PUBLIC_IP}
      RTP_START: ${RTP_START:-10000}
      RTP_END: ${RTP_END:-10200}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-pineclinic_ami_secret_123}
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"
    volumes:
      - asterisk_logs:/var/log/asterisk
      - asterisk_managed:/etc/asterisk/managed
    networks:
      dokploy-network:
        aliases: [voiceai-asterisk]

volumes:
  asterisk_managed:
  postgres_data:
    external: true
    name: voiceai-vfdp7y_postgres_data
  redis_data:
    external: true
    name: voiceai-vfdp7y_redis_data
  asterisk_logs:
    external: true
    name: voiceai-vfdp7y_asterisk_logs

networks:
  dokploy-network:
    external: true

# Dokploy: independent infrastructure stack.
