services:
  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-voiceai}:${POSTGRES_PASSWORD:-voiceai_secret}@voiceai-postgres:5432/voiceai}
      REDIS_URL: ${REDIS_URL:-redis://voiceai-redis:6379}
      POSTGRES_HOST_OVERRIDE: voiceai-postgres
      REDIS_HOST_OVERRIDE: voiceai-redis
      PORT: "3001"
      NODE_ENV: production
      APP_URL: ${APP_URL}
      CLIENT_APP_URL: ${CLIENT_APP_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      GEMINI_LIVE_VOICE: ${GEMINI_LIVE_VOICE:-Aoede}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-europe-west1}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@klinik.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-${ADMIN_PASSWORD}}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-${JWT_SECRET:-${ADMIN_PASSWORD}}}
      DEFAULT_CLINIC_NAME: ${DEFAULT_CLINIC_NAME:-Varsayılan Klinik}
      PLATFORM_ADMIN_HOSTS: ${PLATFORM_ADMIN_HOSTS:-pineclinic.thinpine.com}
      DEFAULT_CLINIC_HOSTS: ${DEFAULT_CLINIC_HOSTS:-pineclinic.thinpine.com}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
      TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-0}
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-12000}
      ASTERISK_AMI_HOST: voiceai-asterisk
      ASTERISK_AMI_PORT: ${ASTERISK_AMI_PORT:-5038}
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER:-voiceai}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-pineclinic_ami_secret_123}
      PHONE_NOISE_GATE_RMS: ${PHONE_NOISE_GATE_RMS:-0}
      PHONE_NOISE_GATE_TRAILING_MS: ${PHONE_NOISE_GATE_TRAILING_MS:-300}
      PHONE_NOISE_GATE_PREROLL_MS: ${PHONE_NOISE_GATE_PREROLL_MS:-60}
      PHONE_VAD_SILENCE_MS: ${PHONE_VAD_SILENCE_MS:-300}
      PHONE_OUTPUT_START_BUFFER_MS: ${PHONE_OUTPUT_START_BUFFER_MS:-700}
      PHONE_OUTPUT_BUFFER_MS: ${PHONE_OUTPUT_BUFFER_MS:-1200}
      NETGSM_SIP_HOST: ${NETGSM_SIP_HOST:-sip.netgsm.com.tr}
      NETGSM_SIP_PORT: ${NETGSM_SIP_PORT:-5060}
      NETGSM_SIP_TRANSPORT: ${NETGSM_SIP_TRANSPORT:-tcp}
      NETGSM_SIP_USER: ${NETGSM_SIP_USER}
      NETGSM_SIP_PASSWORD: ${NETGSM_SIP_PASSWORD}
      NETGSM_PUBLIC_IP: ${NETGSM_PUBLIC_IP}
      RTP_START: ${RTP_START:-10000}
      RTP_END: ${RTP_END:-10200}
      NETGSM_API_BASE: ${NETGSM_API_BASE:-https://api.netgsm.com.tr}
      NETGSM_API_USERCODE: ${NETGSM_API_USERCODE}
      NETGSM_API_PASSWORD: ${NETGSM_API_PASSWORD}
      NETGSM_API_MSGHEADER: ${NETGSM_API_MSGHEADER}
    volumes:
      - server_data:/app/data
      - server_uploads:/app/server/public/uploads
      - server_tenant_assets:/app/server/public/tenant-assets
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3001/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      dokploy-network:
        aliases: [voiceai-server]

volumes:
  server_data:
    external: true
    name: voiceai-vfdp7y_server_data
  server_uploads:
    external: true
    name: voiceai-vfdp7y_server_uploads
  server_tenant_assets:
    external: true
    name: voiceai-vfdp7y_server_tenant_assets

networks:
  dokploy-network:
    external: true
