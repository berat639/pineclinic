services:
  client:
    build:
      context: ../..
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
        SERVER_URL: http://voiceai-server:3001
        BACKEND_PROXY_URL: http://voiceai-server:3001
    restart: always
    environment:
      NODE_ENV: production
      SERVER_URL: http://voiceai-server:3001
      BACKEND_PROXY_URL: http://voiceai-server:3001
      DENTAL_SEGMENTATOR_URL: ${DENTAL_SEGMENTATOR_URL:-http://voiceai-dental-segmentator:8000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-${JWT_SECRET:-${ADMIN_PASSWORD}}}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      dokploy-network:
        aliases: [voiceai-client]

networks:
  dokploy-network:
    external: true
