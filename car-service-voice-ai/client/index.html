<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ata Hyundai – Sesli Asistan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }

    /* Connection */
    .conn { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 2rem; }
    .conn-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; transition: background 0.3s; }
    .conn-dot.on { background: #22c55e; }
    .conn-text { font-size: 0.85rem; color: #94a3b8; }

    /* Mic Button */
    #micBtn {
      width: 120px; height: 120px; border-radius: 50%;
      border: 3px solid #334155;
      background: radial-gradient(circle, #1e293b, #0f172a);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
      margin: 0 auto 1.5rem;
    }
    #micBtn:hover { border-color: #60a5fa; transform: scale(1.05); }
    #micBtn.active { border-color: #22c55e; animation: pulse 1.5s infinite; }
    #micBtn.speaking { border-color: #a78bfa; }
    #micBtn svg { width: 40px; height: 40px; fill: #94a3b8; transition: fill 0.3s; }
    #micBtn.active svg { fill: #22c55e; }
    #micBtn.speaking svg { fill: #a78bfa; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
    }

    /* Status */
    #statusLabel { font-size: 0.95rem; color: #94a3b8; margin-bottom: 1rem; min-height: 1.5rem; }

    /* Transcript */
    #transcript {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.85rem;
      line-height: 1.6;
      margin-top: 1rem;
    }
    #transcript:empty { display: none; }
    .msg-user { color: #60a5fa; }
    .msg-ai { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 Ata Hyundai</h1>
    <p class="subtitle">Sesli Servis Asistanı</p>

    <div class="conn">
      <div class="conn-dot" id="connDot"></div>
      <span class="conn-text" id="connText">Bağlanıyor...</span>
    </div>

    <button id="micBtn">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>

    <div id="statusLabel">Mikrofona basarak başlayın</div>
    <div id="transcript"></div>
  </div>

<script>
const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const WS_URL = `${protocol}//${window.location.host}`;

const micBtn = document.getElementById('micBtn');
const statusLabel = document.getElementById('statusLabel');
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
const transcript = document.getElementById('transcript');

let ws;
let recognition;
let audioCtx;
let isListening = false;
let isPlaying = false;
let isFirstClick = true;

// ── WebSocket ────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    connDot.classList.add('on');
    connText.textContent = 'Bağlı';
  };

  ws.onmessage = async (event) => {
    if (typeof event.data === 'string') {
      const msg = JSON.parse(event.data);
      if (msg.type === 'assistant_text') {
        addToTranscript('ai', msg.text);
      }
    } else {
      // Binary = MP3 ses verisi
      await playAudio(event.data);
    }
  };

  ws.onclose = () => {
    connDot.classList.remove('on');
    connText.textContent = 'Bağlantı koptu';
    setTimeout(connectWS, 2000);
  };
}

// ── Ses Çalma (MP3) ────────────────────────
async function playAudio(blob) {
  if (!audioCtx) audioCtx = new AudioContext();
  isPlaying = true;
  micBtn.classList.add('speaking');
  micBtn.classList.remove('active');
  statusLabel.textContent = 'Asistan konuşuyor...';

  // Asistan konuşurken yankı (kendi sesini duyması) olmaması için mikrofonu kapat
  if (recognition) {
    recognition.stop();
  }

  try {
    const arrayBuf = await (blob instanceof Blob ? blob.arrayBuffer() : blob);
    const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuf;
    source.connect(audioCtx.destination);
    source.start(0);

    source.onended = () => {
      isPlaying = false;
      micBtn.classList.remove('speaking');
      
      // Asistanın sözü bitince müşteriyi dinlemeye geri dön
      startRecognition();
    };
  } catch (err) {
    console.error('Ses çalma hatası:', err);
    isPlaying = false;
    micBtn.classList.remove('speaking');
    startRecognition();
  }
}

// ── Speech Recognition (Tarayıcı) ──────────
function setupRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    statusLabel.textContent = 'Bu tarayıcı ses tanımayı desteklemiyor. Chrome kullanın.';
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'tr-TR';
  recognition.continuous = true;
  recognition.interimResults = true;

  let typingTimer;
  let currentSessionText = '';

  recognition.onresult = (event) => {
    clearTimeout(typingTimer);
    
    let interimText = '';
    let finalText = '';

    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        finalText += event.results[i][0].transcript + ' ';
      } else {
        interimText += event.results[i][0].transcript;
      }
    }

    currentSessionText = (finalText + interimText).trim();
    statusLabel.textContent = currentSessionText || 'Dinliyorum...';

    // 1.5 saniye sessizlik olursa metni gönder
    typingTimer = setTimeout(() => {
      if (currentSessionText && ws && ws.readyState === WebSocket.OPEN) {
        console.log('[Kullanıcı]', currentSessionText);
        addToTranscript('user', currentSessionText);
        statusLabel.textContent = 'Düşünüyor...';
        ws.send(JSON.stringify({ type: 'user_text', text: currentSessionText }));
        
        currentSessionText = '';
        recognition.stop(); // Cevap gelirken dinlemeyi durdur
      }
    }, 1500);
  };

  recognition.onerror = (event) => {
    console.log('[Recognition error]', event.error);
    if (event.error !== 'aborted' && isListening && !isPlaying) {
      setTimeout(() => startRecognition(), 300);
    }
  };

  recognition.onend = () => {
    // Sadece gönderme işlemi yapılmadıysa ve dinlemedeysek yeniden başlat
    if (isListening && !isPlaying && !currentSessionText) {
      setTimeout(() => startRecognition(), 300);
    }
  };
}

function startRecognition() {
  if (!recognition || isPlaying) return;
  try {
    isListening = true;
    recognition.start();
    micBtn.classList.add('active');
    statusLabel.textContent = 'Sizi dinliyorum...';
  } catch (e) {
    // Already started
  }
}

function stopRecognition() {
  isListening = false;
  if (recognition) recognition.stop();
  micBtn.classList.remove('active');
  statusLabel.textContent = 'Mikrofona basarak başlayın';
}

// ── Transcript ──────────────────────────────
function addToTranscript(who, text) {
  const div = document.createElement('div');
  div.className = who === 'user' ? 'msg-user' : 'msg-ai';
  div.textContent = (who === 'user' ? '🧑 ' : '🤖 ') + text;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

// ── Mic Button ──────────────────────────────
micBtn.addEventListener('click', () => {
  if (isListening) {
    stopRecognition();
    return;
  }

  setupRecognition();

  if (isFirstClick) {
    isFirstClick = false;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'greeting' }));
      statusLabel.textContent = 'Asistan hazırlanıyor...';
      // 8 saniye içinde cevap gelmezse yine de dinlemeye başla
      setTimeout(() => {
        if (!isPlaying && !isListening) {
          startRecognition();
        }
      }, 8000);
    }
  } else {
    startRecognition();
  }
});

// Transcript sunucudan gelince ekranda göstermek için ws mesajına ekleme yapalım
// connectWS içinde ws.onmessage zaten tanımlı, oraya müdahale edemeyiz ama ws nesnesini güncellemek zor,
// sunucudan type='transcript' gönderdiğimiz için client/index.html'deki ws.onmessage'ı düzeltmemiz gerek:

// Başlat
connectWS();
</script>
</body>
</html>
