<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Oto Servis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080b14; --surface: #0f1422; --surface2: #161d30;
      --border: rgba(255,255,255,0.07); --accent: #f97316;
      --text: #f1f5f9; --muted: #64748b; --green: #22c55e;
      --red: #ef4444; --yellow: #eab308;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Layout */
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 24px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .sidebar-logo {
      font-size: 14px; font-weight: 700; color: var(--accent);
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0 8px 24px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; font-size: 14px; color: var(--muted);
      cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .nav-item.active { background: rgba(249,115,22,0.12); color: var(--accent); }
    .nav-item:hover { background: var(--surface2); color: var(--text); }

    /* Main */
    .main { padding: 32px; overflow-y: auto; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
    }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-value { font-size: 28px; font-weight: 700; }
    .stat-value.orange { color: var(--accent); }
    .stat-value.green { color: var(--green); }
    .stat-value.blue { color: #60a5fa; }

    /* Live indicator */
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2);
      color: var(--green); font-size: 12px; font-weight: 600;
      padding: 4px 10px; border-radius: 20px; margin-bottom: 20px;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--green);
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* Table */
    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .table-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .table-title { font-size: 15px; font-weight: 600; }
    .refresh-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 14px; border-radius: 8px; font-size: 12px;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 12px 20px; text-align: left; border-bottom: 1px solid var(--border);
    }
    td { padding: 14px 20px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .badge.beklemede { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .badge.tamamlandi { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge.iptal { background: rgba(239,68,68,0.15); color: var(--red); }

    .action-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 10px; border-radius: 6px; font-size: 11px;
      cursor: pointer; transition: all 0.2s; font-family: inherit; margin-right: 4px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.danger:hover { border-color: var(--red); color: var(--red); }

    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">🔧 Oto Servis</div>
    <a class="nav-item active" href="/admin">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Randevular
    </a>
    <a class="nav-item" href="/" target="_blank">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 016 0v8.25a3 3 0 01-3 3z"/></svg>
      Asistan Arayüzü
    </a>
  </nav>

  <!-- Main -->
  <main class="main">
    <h1 class="page-title">Admin Panel</h1>
    <p class="page-sub">Randevular ve aktif görüşmeler</p>

    <div class="live-badge">
      <span class="live-dot"></span>
      <span id="liveText">0 aktif görüşme</span>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Toplam Randevu</div>
        <div class="stat-value orange" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Beklemede</div>
        <div class="stat-value blue" id="statPending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tamamlandı</div>
        <div class="stat-value green" id="statDone">—</div>
      </div>
    </div>

    <!-- Appointments table -->
    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">Randevular</span>
        <button class="refresh-btn" onclick="loadData()">↻ Yenile</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Müşteri</th>
            <th>Telefon</th>
            <th>Araç</th>
            <th>Sorun</th>
            <th>Tarih / Saat</th>
            <th>Durum</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody id="appointmentsBody">
          <tr><td colspan="7" class="empty">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
async function loadData() {
  // Stats
  const stats = await fetch('/api/stats').then(r => r.json());
  document.getElementById('liveText').textContent = `${stats.activeSessions} aktif görüşme`;

  // Appointments
  const data = await fetch('/api/appointments').then(r => r.json());
  document.getElementById('statTotal').textContent = data.length;
  document.getElementById('statPending').textContent = data.filter(a => a.durum === 'beklemede').length;
  document.getElementById('statDone').textContent = data.filter(a => a.durum === 'tamamlandi').length;

  const tbody = document.getElementById('appointmentsBody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Henüz randevu yok</td></tr>';
    return;
  }

  tbody.innerHTML = data
    .sort((a, b) => b.olusturulma.localeCompare(a.olusturulma))
    .map(a => `
      <tr>
        <td><strong>${a.isim}</strong></td>
        <td>${a.telefon}</td>
        <td>${a.arac || '—'}</td>
        <td>${a.sorun}</td>
        <td>${a.tarih || '—'} ${a.saat || ''}</td>
        <td><span class="badge ${a.durum}">${a.durum}</span></td>
        <td>
          ${a.durum === 'beklemede' ? `
            <button class="action-btn" onclick="setStatus('${a.id}', 'tamamlandi')">✓ Tamamla</button>
            <button class="action-btn danger" onclick="setStatus('${a.id}', 'iptal')">✕ İptal</button>
          ` : `<span style="color:var(--muted);font-size:12px">${a.durum}</span>`}
        </td>
      </tr>
    `).join('');
}

async function setStatus(id, durum) {
  await fetch(`/api/appointments/${id}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ durum })
  });
  loadData();
}

loadData();
setInterval(loadData, 5000); // Her 5sn otomatik yenile
</script>
</body>
</html>
