services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: voiceai
      POSTGRES_USER: ${POSTGRES_USER:-voiceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceai_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceai} -d voiceai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-voiceai}:${POSTGRES_PASSWORD:-voiceai_secret}@postgres:5432/voiceai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "3001"
      NODE_ENV: production
      APP_URL: ${APP_URL}
      CLIENT_APP_URL: ${CLIENT_APP_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      GEMINI_LIVE_VOICE: ${GEMINI_LIVE_VOICE:-Aoede}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-europe-west1}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
      TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-0}
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-12000}
      ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST:-asterisk}
      PHONE_NOISE_GATE_RMS: ${PHONE_NOISE_GATE_RMS:-0}
      PHONE_NOISE_GATE_TRAILING_MS: ${PHONE_NOISE_GATE_TRAILING_MS:-300}
      PHONE_NOISE_GATE_PREROLL_MS: ${PHONE_NOISE_GATE_PREROLL_MS:-60}
      PHONE_OUTPUT_BUFFER_MS: ${PHONE_OUTPUT_BUFFER_MS:-1200}
      NETGSM_SIP_HOST: ${NETGSM_SIP_HOST:-sip.netgsm.com.tr}
      NETGSM_SIP_PORT: ${NETGSM_SIP_PORT:-5060}
      NETGSM_SIP_TRANSPORT: ${NETGSM_SIP_TRANSPORT:-tcp}
      NETGSM_SIP_USER: ${NETGSM_SIP_USER}
      NETGSM_SIP_PASSWORD: ${NETGSM_SIP_PASSWORD}
      NETGSM_PUBLIC_IP: ${NETGSM_PUBLIC_IP}
      RTP_START: ${RTP_START:-10000}
      RTP_END: ${RTP_END:-10200}
      NETGSM_API_BASE: ${NETGSM_API_BASE:-https://api.netgsm.com.tr}
      NETGSM_API_USERCODE: ${NETGSM_API_USERCODE}
      NETGSM_API_PASSWORD: ${NETGSM_API_PASSWORD}
      NETGSM_API_MSGHEADER: ${NETGSM_API_MSGHEADER}
      ATA_HSYS_BASE_URL: ${ATA_HSYS_BASE_URL}
      ATA_HSYS_APP_KEY: ${ATA_HSYS_APP_KEY}
      ATA_HSYS_APP_SECRET: ${ATA_HSYS_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        SERVER_URL: http://server:3001
        BACKEND_PROXY_URL: http://server:3001
    restart: always
    environment:
      NODE_ENV: production
      SERVER_URL: http://server:3001
      BACKEND_PROXY_URL: http://server:3001
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  # Asterisk SIP gateway (Netgsm SIP Trunk → AudioSocket → server:12000)
  # SIP signaling 5060/tcp + RTP media 10000-10200/udp host portları açık olmalı.
  # Dokploy stack'i kendi bridge ağına sahip; Asterisk RTP NAT geçişi için
  # pjsip.conf'taki external_signaling_address/external_media_address=NETGSM_PUBLIC_IP
  # zorunlu. (Bkz. infra/asterisk/templates/pjsip.conf.tmpl)
  asterisk:
    build:
      context: ./infra/asterisk
    restart: always
    environment:
      AUDIOSOCKET_HOST: server
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-12000}
      BACKEND_HTTP_PORT: "3001"
      TELEPHONY_CLINIC_HOSTNAME: ${TELEPHONY_CLINIC_HOSTNAME:-pineclinic.thinpine.com}
      TELEPHONY_DID_MAP: ${TELEPHONY_DID_MAP:-}
      NETGSM_SIP_HOST: ${NETGSM_SIP_HOST:-sip.netgsm.com.tr}
      NETGSM_SIP_PORT: ${NETGSM_SIP_PORT:-5060}
      NETGSM_SIP_TRANSPORT: ${NETGSM_SIP_TRANSPORT:-tcp}
      NETGSM_SIP_USER: ${NETGSM_SIP_USER}
      NETGSM_SIP_PASSWORD: ${NETGSM_SIP_PASSWORD}
      NETGSM_PUBLIC_IP: ${NETGSM_PUBLIC_IP}
      RTP_START: ${RTP_START:-10000}
      RTP_END: ${RTP_END:-10200}
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'pjsip show endpoints' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  redis_data:
  server_data:

networks:
  dokploy-network:
    external: true
