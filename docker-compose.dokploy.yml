services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voiceai-postgres
    restart: always
    environment:
      POSTGRES_DB: voiceai
      POSTGRES_USER: ${POSTGRES_USER:-voiceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceai_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceai} -d voiceai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    container_name: voiceai-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: voiceai-server
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voiceai}:${POSTGRES_PASSWORD:-voiceai_secret}@voiceai-postgres:5432/voiceai
      REDIS_URL: redis://voiceai-redis:6379
      PORT: "3001"
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      ASTERISK_AMI_HOST: voiceai-asterisk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.pinecllinic.thinpine.com/ws}
        SERVER_URL: http://voiceai-server:3001
        BACKEND_PROXY_URL: http://voiceai-server:3001
    container_name: voiceai-client
    restart: always
    environment:
      NODE_ENV: production
      SERVER_URL: http://voiceai-server:3001
      BACKEND_PROXY_URL: http://voiceai-server:3001
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

  # Asterisk SIP gateway (Netgsm SIP Trunk → AudioSocket → voiceai-server:12000)
  # SIP signaling 5060/tcp + RTP media 10000-10200/udp host portları açık olmalı.
  # Dokploy stack'i kendi bridge ağına sahip; Asterisk RTP NAT geçişi için
  # pjsip.conf'taki external_signaling_address/external_media_address=NETGSM_PUBLIC_IP
  # zorunlu. (Bkz. infra/asterisk/templates/pjsip.conf.tmpl)
  asterisk:
    build:
      context: ./infra/asterisk
    container_name: voiceai-asterisk
    restart: always
    env_file:
      - .env
    environment:
      AUDIOSOCKET_HOST: voiceai-server
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-12000}
      BACKEND_HTTP_PORT: "3001"
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'pjsip show endpoints' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  redis_data:
  server_data:

networks:
  dokploy-network:
    external: true
